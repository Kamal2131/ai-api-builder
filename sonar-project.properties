# SonarCloud project configuration — analysis runs from CI (see ci.yml).
# The project key/organization must match the project as imported on sonarcloud.io.

sonar.projectKey=Kamal2131_ai-api-builder
sonar.organization=kamal2131

sonar.sources=src
sonar.tests=tests
# Jinja templates are generated-project output, not service code.
sonar.exclusions=src/agents/api_builder_agent/templates/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
