services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU is optional; Qwen2.5-3B / Phi-3 run on CPU (slower). To use an NVIDIA GPU,
    # install the NVIDIA Container Toolkit and uncomment the block below.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api-builder:
    build: .
    ports:
      - "8080:8080"
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
    depends_on:
      - ollama

volumes:
  ollama_models:
