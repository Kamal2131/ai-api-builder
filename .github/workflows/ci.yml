name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't inject code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history — SonarCloud needs blame data for new-code detection.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # --only-binary :all: forbids sdists, so no setup.py ever executes here.
        run: |
          pip install --only-binary :all: -r requirements.txt
          pip install --only-binary :all: ruff==0.16.0

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests with coverage gate (pytest)
        # No LLM in CI — the planner falls back to heuristics, so the suite is hermetic.
        # The build fails if service-code coverage drops below 85%.
        # coverage.xml feeds the SonarCloud scan below.
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: SonarCloud scan
        # Needs the SONAR_TOKEN secret, which fork PRs and Dependabot-triggered
        # runs don't receive — run only for pushes and same-repo PRs by humans.
        if: >-
          github.repository == 'Kamal2131/ai-api-builder' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -t ai-api-builder:${{ github.sha }} .
