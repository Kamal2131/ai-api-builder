name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — SonarCloud needs blame data for new-code detection.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests with coverage gate (pytest)
        # No LLM in CI — the planner falls back to heuristics, so the suite is hermetic.
        # The build fails if service-code coverage drops below 85%.
        # coverage.xml feeds the SonarCloud scan below.
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: SonarCloud scan
        # Needs the SONAR_TOKEN secret, which fork PRs don't receive — run only
        # for pushes and same-repo PRs in the upstream repository.
        if: >-
          github.repository == 'Kamal2131/ai-api-builder' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-api-builder:${{ github.sha }} .
